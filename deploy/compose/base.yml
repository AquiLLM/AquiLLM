x-common-variables: &db-variables
  POSTGRES_NAME: ${POSTGRES_NAME:?POSTGRES_NAME is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}

# Satellite vLLM services set VLLM_EXTRA_ARGS from ${OCR_VLLM_EXTRA_ARGS} etc. Compose reads those names
# from the environment used at parse time — pass repo .env, e.g.  docker compose --env-file .env -f deploy/compose/base.yml …
# If unset, substitution is empty and /vllm_start.sh still applies *_VLLM_EXTRA_ARGS from the container env_file.

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web/Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "5678:5678"
    env_file:
      - ../../.env
    environment:
      PORT: ${PORT:-8080}
      POSTGRES_HOST: db
      STORAGE_HOST: storage:9000
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      APP_EMBED_MODEL_REVISION: ${APP_EMBED_MODEL_REVISION:-}
      KG_EXTRACTION_QUEUE: ${KG_EXTRACTION_QUEUE-knowledge-graph-extraction}
      KG_QUERY_EXTRACTOR_URL: http://knowledge_graph_query_extractor:8000
      KG_QUERY_EXTRACTOR_BEARER_TOKEN: ${KG_QUERY_EXTRACTOR_BEARER_TOKEN:-}
      KG_QUERY_EXTRACTOR_BUILD_HASH: ${KG_QUERY_EXTRACTOR_BUILD_HASH:-}
      KG_TOPOLOGY_GATEWAY_URL: http://knowledge_graph_query_gateway:8092
      KG_TOPOLOGY_GATEWAY_BEARER_TOKEN: ${KG_TOPOLOGY_GATEWAY_BEARER_TOKEN:-}
      KG_MEMGRAPH_URI:
      KG_MEMGRAPH_DATABASE:
      KG_MEMGRAPH_QUERY_USERNAME:
      KG_MEMGRAPH_QUERY_PASSWORD:
      KG_MEMGRAPH_PROJECTION_USERNAME:
      KG_MEMGRAPH_PROJECTION_PASSWORD:
      KG_PROJECTION_POSTGRES_SOURCE_DSN:
      KG_PROJECTION_POSTGRES_STATE_DSN:
      KG_PROJECTION_IDENTIFIER_HMAC_KEY: ${KG_PROJECTION_IDENTIFIER_HMAC_KEY:-}
      RUN_CELERY_IN_WEB: 0
      C_FORCE_ROOT: 1
      <<: *db-variables
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
        required: false
      vllm_transcribe:
        condition: service_healthy
        required: false
      vllm_embed:
        condition: service_healthy
        required: false
      vllm_rerank:
        condition: service_healthy
        required: false
    volumes:
      - ../..:/app
    networks: [default, knowledge_graph_api]

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/web/Dockerfile
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: db
      STORAGE_HOST: storage:9000
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      APP_EMBED_MODEL_REVISION: ${APP_EMBED_MODEL_REVISION:-}
      KG_EXTRACTION_QUEUE: ${KG_EXTRACTION_QUEUE-knowledge-graph-extraction}
      KG_MEMGRAPH_URI:
      KG_MEMGRAPH_DATABASE:
      KG_MEMGRAPH_QUERY_USERNAME:
      KG_MEMGRAPH_QUERY_PASSWORD:
      KG_MEMGRAPH_PROJECTION_USERNAME:
      KG_MEMGRAPH_PROJECTION_PASSWORD:
      KG_PROJECTION_POSTGRES_SOURCE_DSN:
      KG_PROJECTION_POSTGRES_STATE_DSN:
      KG_PROJECTION_IDENTIFIER_HMAC_KEY:
      RUN_CELERY_IN_WEB: 0
      C_FORCE_ROOT: 1
      <<: *db-variables
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
        required: false
      vllm_transcribe:
        condition: service_healthy
        required: false
      vllm_embed:
        condition: service_healthy
        required: false
      vllm_rerank:
        condition: service_healthy
        required: false
    volumes:
      - ../..:/app
    command: sh -c "cd /app/aquillm && celery -A aquillm worker --loglevel=info --queues=celery"

  worker_knowledge_graph:
    build:
      context: ../..
      dockerfile: deploy/docker/knowledge-graph/Dockerfile
    profiles:
      - knowledge-graph
    restart: on-failure
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      KG_BUILD_ENABLED: ${KG_BUILD_ENABLED:-0}
      KG_OVERLAY_ENABLED: ${KG_OVERLAY_ENABLED:-0}
      KG_EVAL_BYPASS_ALLOWED: ${KG_EVAL_BYPASS_ALLOWED:-0}
      KG_SCHEMA_GENERATION_ENABLED: ${KG_SCHEMA_GENERATION_ENABLED:-0}
      KG_SCHEMA_GENERATION_MAX_CHUNKS: ${KG_SCHEMA_GENERATION_MAX_CHUNKS:-32}
      KG_SCHEMA_GENERATION_MAX_CHARACTERS: ${KG_SCHEMA_GENERATION_MAX_CHARACTERS:-48000}
      KG_SCHEMA_GENERATION_TIMEOUT_SECONDS: ${KG_SCHEMA_GENERATION_TIMEOUT_SECONDS:-180}
      KG_EXTRACTION_QUEUE: ${KG_EXTRACTION_QUEUE-knowledge-graph-extraction}
      KG_MEMGRAPH_URI:
      KG_MEMGRAPH_DATABASE:
      KG_MEMGRAPH_QUERY_USERNAME:
      KG_MEMGRAPH_QUERY_PASSWORD:
      KG_MEMGRAPH_PROJECTION_USERNAME:
      KG_MEMGRAPH_PROJECTION_PASSWORD:
      KG_PROJECTION_POSTGRES_SOURCE_DSN:
      KG_PROJECTION_POSTGRES_STATE_DSN:
      KG_PROJECTION_IDENTIFIER_HMAC_KEY:
      KG_GLINER2_DEVICE: cpu
      HF_HOME: ${KG_GLINER2_CACHE_DIR:-/root/.cache/huggingface}
      KG_GLINER2_CACHE_DIR: ${KG_GLINER2_CACHE_DIR:-/root/.cache/huggingface}
      C_FORCE_ROOT: 1
      RUN_CELERY_IN_WEB: 0
      UV_PROJECT_ENVIRONMENT: /opt/venv
      VIRTUAL_ENV: /opt/venv
      PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      <<: *db-variables
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../artifacts:/app/artifacts
      - "${KG_HF_CACHE_HOST_PATH:-../../data/hf_knowledge_graph}:${KG_GLINER2_CACHE_DIR:-/root/.cache/huggingface}"
    command: /bin/sh -c 'python -c "from lib.knowledge_graph.config import load_extraction_queue; load_extraction_queue()" && exec /opt/venv/bin/celery -A aquillm worker --loglevel=info --queues="$${KG_EXTRACTION_QUEUE}" --concurrency=1 --prefetch-multiplier=1 --hostname=worker-knowledge-graph@%h'

  memgraph_knowledge_graph:
    image: ${KG_MEMGRAPH_IMAGE:-memgraph/memgraph-mage:3.8.1}
    profiles: [knowledge-graph]
    restart: unless-stopped
    environment:
      MEMGRAPH_USER: ${KG_MEMGRAPH_PROJECTION_USERNAME:-}
      MEMGRAPH_PASSWORD: ${KG_MEMGRAPH_PROJECTION_PASSWORD:-}
    volumes:
      - knowledge_graph_memgraph_data:/var/lib/memgraph
    networks: [knowledge_graph_store]
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$MEMGRAPH_USER\" && test -n \"$$MEMGRAPH_PASSWORD\" && mgconsole --host 127.0.0.1 --port 7687 --username '$$MEMGRAPH_USER' --password '$$MEMGRAPH_PASSWORD' --execute 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  knowledge_graph_query_gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/knowledge-graph/Dockerfile
    profiles: [knowledge-graph]
    restart: unless-stopped
    environment:
      KG_MEMGRAPH_URI: bolt://memgraph_knowledge_graph:7687
      KG_MEMGRAPH_DATABASE: ${KG_MEMGRAPH_DATABASE:-memgraph}
      KG_MEMGRAPH_QUERY_USERNAME: ${KG_MEMGRAPH_QUERY_USERNAME:-}
      KG_MEMGRAPH_QUERY_PASSWORD: ${KG_MEMGRAPH_QUERY_PASSWORD:-}
      KG_TOPOLOGY_GATEWAY_BEARER_TOKEN: ${KG_TOPOLOGY_GATEWAY_BEARER_TOKEN:-}
      KG_TOPOLOGY_GATEWAY_TIMEOUT_MS: ${KG_TOPOLOGY_GATEWAY_TIMEOUT_MS:-300}
      KG_TOPOLOGY_GATEWAY_MAX_REQUEST_BYTES: ${KG_TOPOLOGY_GATEWAY_MAX_REQUEST_BYTES:-16384}
      KG_TOPOLOGY_GATEWAY_MAX_RESPONSE_BYTES: ${KG_TOPOLOGY_GATEWAY_MAX_RESPONSE_BYTES:-1048576}
    depends_on:
      memgraph_knowledge_graph: {condition: service_healthy}
    networks: [knowledge_graph_api, knowledge_graph_store]
    command: /opt/venv/bin/uvicorn apps.knowledge_graph.retrieval.topology.gateway_service:app --host 0.0.0.0 --port 8092 --no-access-log
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/readyz', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  knowledge_graph_query_extractor:
    build:
      context: ../..
      dockerfile: deploy/docker/knowledge-graph/Dockerfile
    profiles: [knowledge-graph]
    restart: unless-stopped
    environment:
      KG_QUERY_EXTRACTOR_URL: http://knowledge_graph_query_extractor:8000
      KG_QUERY_EXTRACTOR_BEARER_TOKEN: ${KG_QUERY_EXTRACTOR_BEARER_TOKEN:-}
      KG_QUERY_EXTRACTOR_BUILD_HASH: ${KG_QUERY_EXTRACTOR_BUILD_HASH:-}
      KG_QUERY_EXTRACTOR_MODEL: fastino/gliner2-base-v1
      KG_QUERY_EXTRACTOR_MODEL_REVISION: 8437ba583a733d87f56ae902f3b197934eedd58e
      KG_QUERY_EXTRACTOR_EXPECTED_SCHEMA_VERSION: query-entities-v1
      KG_QUERY_EXTRACTOR_EXPECTED_SCHEMA_CHECKSUM: 45bc8f86637a73324d2edae3096aac61d242fb0bcbab3c481cfa7599456cd271
      KG_QUERY_EXTRACTOR_ONTOLOGY_PATH: /app/aquillm/apps/knowledge_graph/ontologies/research-v1.yaml
      KG_QUERY_EXTRACTOR_ONTOLOGY_CHECKSUM: ${KG_QUERY_EXTRACTOR_ONTOLOGY_CHECKSUM:-}
      KG_QUERY_EXTRACTOR_TIMEOUT_MS: ${KG_QUERY_EXTRACTOR_TIMEOUT_MS:-75}
      KG_QUERY_MAX_BYTES: ${KG_QUERY_MAX_BYTES:-4096}
      KG_QUERY_MAX_CODEPOINTS: ${KG_QUERY_MAX_CODEPOINTS:-2048}
      KG_QUERY_MAX_SPANS: ${KG_QUERY_MAX_SPANS:-32}
      KG_GLINER2_DEVICE: cpu
      HF_HOME: /root/.cache/huggingface
    volumes:
      - knowledge_graph_hf_cache:/root/.cache/huggingface
    networks: [knowledge_graph_api]
    command: /opt/venv/bin/uvicorn lib.knowledge_graph.query_extractor.service:app --host 0.0.0.0 --port 8000 --no-access-log
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker_knowledge_graph_projection:
    build:
      context: ../..
      dockerfile: deploy/docker/knowledge-graph/Dockerfile
    profiles: [knowledge-graph]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      GOOGLE_OAUTH2_CLIENT_ID:
      GOOGLE_OAUTH2_CLIENT_SECRET:
      OPENAI_API_KEY: disabled
      GEMINI_API_KEY: disabled
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 1
      DJANGO_DEBUG: 0
      KG_MEMGRAPH_PROJECTION_ENABLED: ${KG_MEMGRAPH_PROJECTION_ENABLED:-0}
      KG_MEMGRAPH_URI: bolt://memgraph_knowledge_graph:7687
      KG_MEMGRAPH_DATABASE: ${KG_MEMGRAPH_DATABASE:-memgraph}
      KG_MEMGRAPH_PROJECTION_USERNAME: ${KG_MEMGRAPH_PROJECTION_USERNAME:-}
      KG_MEMGRAPH_PROJECTION_PASSWORD: ${KG_MEMGRAPH_PROJECTION_PASSWORD:-}
      KG_PROJECTION_POSTGRES_SOURCE_DSN: ${KG_PROJECTION_POSTGRES_SOURCE_DSN:-}
      KG_PROJECTION_POSTGRES_STATE_DSN: ${KG_PROJECTION_POSTGRES_STATE_DSN:-}
      KG_PROJECTION_IDENTIFIER_HMAC_KEY: ${KG_PROJECTION_IDENTIFIER_HMAC_KEY:-}
      KG_PROJECTION_IDENTIFIER_KEY_VERSION: ${KG_PROJECTION_IDENTIFIER_KEY_VERSION:-}
      KG_PROJECTION_SCHEMA_VERSION: ${KG_PROJECTION_SCHEMA_VERSION:-collection-graph-v1}
      KG_PROJECTION_FORMAT_VERSION: ${KG_PROJECTION_FORMAT_VERSION:-projection-v1}
      KG_PROJECTION_QUEUE: ${KG_PROJECTION_QUEUE:-knowledge_graph_projection}
      C_FORCE_ROOT: 1
      UV_PROJECT_ENVIRONMENT: /opt/venv
      VIRTUAL_ENV: /opt/venv
      PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      memgraph_knowledge_graph: {condition: service_healthy}
    networks: [knowledge_graph_control, knowledge_graph_store]
    command: /bin/sh -c 'exec /opt/venv/bin/celery -A aquillm worker --loglevel=info --queues="$${KG_PROJECTION_QUEUE}" --concurrency=1 --prefetch-multiplier=1 --hostname=worker-knowledge-graph-projection@%h'



  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      <<: *db-variables
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [default, knowledge_graph_control]



  storage:
    image: minio/minio
    restart: unless-stopped
    ports: 
      - "9001:9001"
    env_file:
      - ../../.env
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}

    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', '-I', 'localhost:9000/minio/health/live']
      interval: 5s
      timeout: 10s
      start_period: 15s
    command: minio server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set aquillm http://storage:9000 dev rickbailey;
      /usr/bin/mc mb aquillm/aquillm;
      exit 0;"

  redis:
    image: redis:7.4-bookworm
    networks: [default, knowledge_graph_control]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vllm:
    build:
      context: ../..
      dockerfile: deploy/docker/vllm/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    restart: unless-stopped
    profiles:
      - vllm
    env_file:
      - ../../.env
    environment:
      # Chat vLLM: keep VLLM_EXTRA_ARGS / max_len / trust_remote_code / TP from ../../.env (env_file) only.
      # (Do not set VLLM_EXTRA_ARGS=${VLLM_EXTRA_ARGS} here — empty Compose substitution would wipe .env.)
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - LMCACHE_ENABLED=${LMCACHE_ENABLED:-0}
      - LMCACHE_EXTRA_ARGS=${LMCACHE_EXTRA_ARGS:-}
    ports:
      - "8000:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  vllm_ocr:
    build:
      context: ../..
      dockerfile: deploy/docker/vllm/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    restart: unless-stopped
    profiles:
      - ocr-sidecar
    depends_on:
      vllm:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_MODEL=${OCR_VLLM_MODEL:-Qwen/Qwen3.5-4B}
      - VLLM_SERVED_MODEL_NAME=${OCR_VLLM_SERVED_MODEL_NAME:-qwen3.5-ocr}
      - VLLM_TOKENIZER=${OCR_VLLM_TOKENIZER:-Qwen/Qwen3.5-4B}
      - VLLM_TENSOR_PARALLEL_SIZE=${OCR_VLLM_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_GPU_MEMORY_UTILIZATION=${OCR_VLLM_GPU_MEMORY_UTILIZATION:-0.15}
      - VLLM_MAX_MODEL_LEN=${OCR_VLLM_MAX_MODEL_LEN:-4096}
      - VLLM_DTYPE=${OCR_VLLM_DTYPE:-float16}
      - "VLLM_EXTRA_ARGS=${OCR_VLLM_EXTRA_ARGS}"
      - VLLM_TRUST_REMOTE_CODE=${OCR_VLLM_TRUST_REMOTE_CODE:-1}
    ports:
      - "8004:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  vllm_transcribe:
    build:
      context: ../..
      dockerfile: deploy/docker/vllm/Dockerfile.transcribe
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    restart: unless-stopped
    profiles:
      - vllm
    depends_on:
      vllm:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_MODEL=${TRANSCRIBE_VLLM_MODEL:-nvidia/nemotron-3.5-asr-streaming-0.6b}
      - VLLM_REVISION=${TRANSCRIBE_VLLM_REVISION-f3d333391852ba876df169dcc9ba902d25b6ab0b}
      - VLLM_SERVED_MODEL_NAME=${TRANSCRIBE_VLLM_SERVED_MODEL_NAME:-nemotron-3.5-asr-streaming-0.6b}
      - VLLM_TOKENIZER=${TRANSCRIBE_VLLM_TOKENIZER:-nvidia/nemotron-3.5-asr-streaming-0.6b}
      - VLLM_TENSOR_PARALLEL_SIZE=${TRANSCRIBE_VLLM_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_GPU_MEMORY_UTILIZATION=${TRANSCRIBE_VLLM_GPU_MEMORY_UTILIZATION:-0.20}
      - VLLM_MAX_MODEL_LEN=${TRANSCRIBE_VLLM_MAX_MODEL_LEN:-50000}
      - VLLM_DTYPE=${TRANSCRIBE_VLLM_DTYPE:-float32}
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=${TRANSCRIBE_VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}
      - VLLM_SERVICE_KIND=transcribe
      - VLLM_USE_V2_MODEL_RUNNER=0
      - "VLLM_EXTRA_ARGS=${TRANSCRIBE_VLLM_EXTRA_ARGS}"
      - VLLM_TRUST_REMOTE_CODE=${TRANSCRIBE_VLLM_TRUST_REMOTE_CODE:-1}
    ports:
      - "8005:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  vllm_embed:
    build:
      context: ../..
      dockerfile: deploy/docker/vllm/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    restart: unless-stopped
    profiles:
      - vllm
    depends_on:
      vllm_transcribe:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_API_KEY=EMPTY
      - VLLM_DOWNLOAD_DIR=/root/.cache/huggingface/hub
      - VLLM_PYTHON_BIN=python3
      - VLLM_MODEL=${APP_EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      - VLLM_REVISION=${APP_EMBED_MODEL_REVISION:-}
      - VLLM_TOKENIZER_REVISION=${APP_EMBED_TOKENIZER_REVISION:-}
      - VLLM_CODE_REVISION=${APP_EMBED_CODE_REVISION:-}
      - VLLM_SERVED_MODEL_NAME=${APP_EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      - VLLM_TOKENIZER=${APP_EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      - VLLM_RUNNER=${APP_EMBED_VLLM_RUNNER:-pooling}
      - VLLM_DTYPE=${APP_EMBED_VLLM_DTYPE:-float16}
      - VLLM_STRICT_PROTECTED_ARGS=1
      - VLLM_TENSOR_PARALLEL_SIZE=${MEM0_EMBED_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_GPU_MEMORY_UTILIZATION=${MEM0_EMBED_GPU_MEMORY_UTILIZATION:-0.20}
      - VLLM_MAX_MODEL_LEN=${MEM0_EMBED_MAX_MODEL_LEN:-2048}
      - "VLLM_EXTRA_ARGS=${MEM0_EMBED_VLLM_EXTRA_ARGS}"
      - VLLM_TRUST_REMOTE_CODE=${MEM0_EMBED_VLLM_TRUST_REMOTE_CODE:-1}
    ports:
      - "8002:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  vllm_rerank:
    build:
      context: ../..
      dockerfile: deploy/docker/vllm/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    restart: unless-stopped
    profiles:
      - vllm
    depends_on:
      vllm_embed:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_API_KEY=EMPTY
      - VLLM_DOWNLOAD_DIR=/root/.cache/huggingface/hub
      - VLLM_PYTHON_BIN=python3
      - VLLM_MODEL=${APP_RERANK_VLLM_MODEL:-Qwen/Qwen3-VL-Reranker-2B}
      - VLLM_REVISION=${APP_RERANK_MODEL_REVISION:-}
      - VLLM_TOKENIZER_REVISION=${APP_RERANK_TOKENIZER_REVISION:-}
      - VLLM_CODE_REVISION=${APP_RERANK_CODE_REVISION:-}
      - VLLM_SERVED_MODEL_NAME=${APP_RERANK_MODEL:-Qwen/Qwen3-VL-Reranker-2B}
      - VLLM_TOKENIZER=${APP_RERANK_TOKENIZER:-Qwen/Qwen3-VL-Reranker-2B}
      - VLLM_RUNNER=${APP_RERANK_VLLM_RUNNER:-pooling}
      - VLLM_DTYPE=${APP_RERANK_VLLM_DTYPE:-float16}
      - VLLM_STRICT_PROTECTED_ARGS=1
      - VLLM_TASK=
      - VLLM_TENSOR_PARALLEL_SIZE=${APP_RERANK_TENSOR_PARALLEL_SIZE:-1}
      # Must be <= free_vram/total_vram at startup (other vLLM/chat procs on same GPU reduce free VRAM).
      - VLLM_GPU_MEMORY_UTILIZATION=${APP_RERANK_GPU_MEMORY_UTILIZATION:-0.30}
      - VLLM_MAX_MODEL_LEN=${APP_RERANK_MAX_MODEL_LEN:-1024}
      - "VLLM_EXTRA_ARGS=${APP_RERANK_VLLM_EXTRA_ARGS}"
      - VLLM_TRUST_REMOTE_CODE=${APP_RERANK_VLLM_TRUST_REMOTE_CODE:-1}
    ports:
      - "8003:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


volumes:
  postgres_data:
  minio_data:
  vllm_data:
  knowledge_graph_memgraph_data:
  knowledge_graph_hf_cache:

networks:
  knowledge_graph_api:
    internal: true
  knowledge_graph_store:
    internal: true
  knowledge_graph_control:
    internal: true

