{% extends "aquillm/base.html" %}
{% block title %}AquiLLM -- Chat{% endblock %}

{% block before_react_bundle %}
<script data-convo-id="{{ convo_id }}">
{% include "aquillm/includes/chat_socket_bootstrap.js" %}
</script>
{% endblock %}

{% block content %}
<div id="chat-mount" class="h-full"></div>
{% endblock %}




{% block scripts %}
<script>
    mountReactComponent('chat-mount', 'ChatComponent', {
        convoId: {{ convo_id }},
        contextLimit: {{ context_limit|default:200000 }},
        collectionsUrl: window.apiUrls.api_collections,

    });
</script>
{% endblock %}
