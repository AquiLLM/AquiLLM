name: test-backend-frontend

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aquillm
          POSTGRES_PASSWORD: aquillm
          POSTGRES_DB: aquillm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquillm -d aquillm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DJANGO_DEBUG: "1"
      SECRET_KEY: ci-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_NAME: aquillm
      POSTGRES_USER: aquillm
      POSTGRES_PASSWORD: aquillm
      OPENAI_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      LLM_CHOICE: OPENAI
      MEM0_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        working-directory: aquillm
        run: python manage.py check
      - name: Architecture + import-boundary tests
        run: >-
          python -m pytest
          aquillm/tests/integration/test_architecture_import_boundaries.py
          aquillm/tests/integration/test_context_processors_urls.py
          aquillm/tests/integration/test_document_image_view.py
          -q --tb=short
      - name: Chat, retrieval, document, and deployment regressions
        run: >-
          python -m pytest
          aquillm/apps/chat/tests
          aquillm/apps/documents/tests
          aquillm/lib/llm/tests
          aquillm/lib/embeddings/tests
          aquillm/lib/tools/search/tests
          aquillm/apps/memory/tests/test_chat_memory_latency.py
          aquillm/apps/ingestion/tests/test_transcribe_provider_selection.py
          aquillm/tests/test_app_startup.py
          aquillm/tests/integration/test_rag_observability_logging.py
          aquillm/tests/integration/test_vllm_extra_args_parser.py
          aquillm/tests/integration/test_vllm_genesis_image.py
          aquillm/tests/integration/test_vllm_transcribe_image.py
          aquillm/tests/integration/test_vllm_readiness.py
          aquillm/tests/integration/test_vllm_lmcache_plumbing.py
          aquillm/tests/integration/test_compose_multimodal_services.py
          aquillm/tests/integration/test_compose_render_test_support.py
          aquillm/tests/integration/test_sidecar_revision_compose.py
          tests/asr
          deploy/vllm_plugins/nemotron_asr/tests
          tests/unit/test_nemotron_verification_harness.py
          tests/test_check_logging_conventions.py
          tests/test_check_retrieval_logging.py
          -q --tb=short
      - name: Logging and file-size guardrails
        run: |
          python scripts/check_logging_conventions.py
          python scripts/check_retrieval_logging.py
          python scripts/check_file_lengths.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
