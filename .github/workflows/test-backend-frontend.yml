name: test-backend-frontend

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aquillm
          POSTGRES_PASSWORD: aquillm
          POSTGRES_DB: aquillm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquillm -d aquillm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DJANGO_DEBUG: "1"
      SECRET_KEY: ci-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_NAME: aquillm
      POSTGRES_USER: aquillm
      POSTGRES_PASSWORD: aquillm
      OPENAI_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Provision projection roles required by migrations
        run: |
          python - <<'PY'
          import os

          import psycopg2
          from psycopg2 import sql

          connection = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"],
              dbname=os.environ["POSTGRES_NAME"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          )
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  for role in ("aquillm_projection_source", "aquillm_projection_state"):
                      cursor.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
                      if cursor.fetchone() is None:
                          cursor.execute(
                              sql.SQL("CREATE ROLE {} NOLOGIN").format(sql.Identifier(role))
                          )
          finally:
              connection.close()
          PY
      - name: Django system check
        working-directory: aquillm
        run: python manage.py check
      - name: Architecture + import-boundary tests
        run: >-
          python -m pytest
          aquillm/tests/integration/test_architecture_import_boundaries.py
          aquillm/tests/integration/test_context_processors_urls.py
          aquillm/tests/integration/test_document_image_view.py
          -q --tb=short
      - name: Hybrid graph runtime static contracts
        run: >-
          python -m pytest
          aquillm/apps/knowledge_graph/tests/test_projection_database_routing.py
          aquillm/tests/integration/test_knowledge_graph_compose.py
          aquillm/tests/integration/test_knowledge_graph_query_extractor_compose.py
          aquillm/tests/integration/test_task21_knowledge_graph_eval_compose.py
          -q --tb=short
      - name: Adaptive evidence and score contracts
        run: >-
          python -m pytest
          aquillm/apps/chat/tests/test_rag_selection_config.py
          aquillm/apps/chat/tests/test_rag_selection_policy.py
          aquillm/apps/chat/tests/test_rag_selection.py
          aquillm/apps/chat/tests/test_rag_retrieval.py
          aquillm/apps/chat/tests/test_evidence_selection_eval.py
          aquillm/apps/chat/tests/test_rag_evidence_handoff.py
          aquillm/apps/chat/tests/test_direct_rag_pipeline.py
          aquillm/apps/documents/tests/test_rerank_scores.py
          aquillm/apps/documents/tests/test_rerank_score_providers.py
          aquillm/apps/documents/tests/test_rerank_model_identity.py
          aquillm/apps/documents/tests/test_chunk_search_score_transport.py
          aquillm/apps/documents/tests/test_chunk_search_graph_overlay.py
          aquillm/apps/documents/tests/test_hybrid_graph_reranker_authority.py
          aquillm/apps/documents/tests/test_retrieval_log_redaction.py
          aquillm/tests/integration/test_retrieval_authorization_propagation.py
          -q --tb=short
      - name: Projected PPR restart contracts
        run: >-
          python -m pytest
          aquillm/lib/knowledge_graph/tests/test_ppr_restart_config.py
          aquillm/apps/knowledge_graph/tests/test_ppr_policy.py
          aquillm/apps/knowledge_graph/tests/test_projected_ppr_execution.py
          aquillm/apps/knowledge_graph/tests/test_projected_ppr_caps.py
          aquillm/apps/knowledge_graph/tests/test_ppr_restart_eval.py
          -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run build
