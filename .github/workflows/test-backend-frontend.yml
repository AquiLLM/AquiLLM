  projection-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restricted projection database and publication contracts
        run: >-
          python scripts/run_rag_remediation_tests.py
          --project aquillm-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}
          --
          aquillm/tests/integration/test_projection_database_deadline.py
          aquillm/tests/integration/test_projection_database_fetch_deadline.py
          aquillm/tests/integration/test_projection_representation_publication_races.py
          aquillm/tests/integration/test_projection_representation_state_boundary.py
          aquillm/apps/knowledge_graph/tests/test_frontier_packed_store_v3.py
          aquillm/apps/knowledge_graph/tests/test_frontier_scope_memgraph_v3.py
          aquillm/apps/knowledge_graph/tests/test_frontier_scope_memgraph_bounds_v3.py
          aquillm/apps/knowledge_graph/tests/test_consumed_source_physical_v3.py
          -p scripts.pytest_required_services -q --tb=short
      - name: Clean up the owned test stack
        if: always()
        run: >-
          python scripts/run_rag_remediation_tests.py
          --project aquillm-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}
          --cleanup

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
