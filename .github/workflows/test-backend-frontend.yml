name: test-backend-frontend

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aquillm
          POSTGRES_PASSWORD: aquillm
          POSTGRES_DB: aquillm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquillm -d aquillm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DJANGO_DEBUG: "1"
      SECRET_KEY: ci-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_NAME: aquillm
      POSTGRES_USER: aquillm
      POSTGRES_PASSWORD: aquillm
      OPENAI_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      LLM_CHOICE: OPENAI
      MEM0_ENABLED: "0"
    steps:
      - name: Resolve the isolated task broker
        # Base settings use the Compose hostname; this runner has its own Redis.
        run: echo '127.0.0.1 redis' | sudo tee -a /etc/hosts
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r deploy/vllm_plugins/nemotron_asr/requirements-test.txt
      - name: Provision projection roles required by migrations
        run: |
          python - <<'PY'
          import os

          import psycopg2
          from psycopg2 import sql

          connection = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"],
              dbname=os.environ["POSTGRES_NAME"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          )
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  for role in ("aquillm_projection_source", "aquillm_projection_state"):
                      cursor.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
                      if cursor.fetchone() is None:
                          cursor.execute(
                              sql.SQL("CREATE ROLE {} NOLOGIN").format(sql.Identifier(role))
                          )
          finally:
              connection.close()
          PY
      - name: Django system check
        working-directory: aquillm
        run: python manage.py check
      - name: Architecture + import-boundary tests
        run: >-
          python -m pytest
          aquillm/tests/integration/test_architecture_import_boundaries.py
          aquillm/tests/integration/test_context_processors_urls.py
