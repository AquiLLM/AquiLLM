name: test-backend-frontend

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aquillm
          POSTGRES_PASSWORD: aquillm
          POSTGRES_DB: aquillm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquillm -d aquillm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DJANGO_DEBUG: "1"
      SECRET_KEY: ci-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_NAME: aquillm
      POSTGRES_USER: aquillm
      POSTGRES_PASSWORD: aquillm
      OPENAI_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      LLM_CHOICE: OPENAI
      MEM0_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        working-directory: aquillm
        run: python manage.py check
      - name: Architecture + import-boundary tests
        run: >-
          python -m pytest
          aquillm/tests/integration/test_architecture_import_boundaries.py
          aquillm/tests/integration/test_context_processors_urls.py
          aquillm/tests/integration/test_document_image_view.py
          -q --tb=short
      - name: Production reliability regressions
        run: >-
          python -m pytest
          aquillm/lib/tools/search/tests/test_vector_search_pack.py
          aquillm/lib/llm/tests/test_spin_tool_budget.py
          aquillm/apps/documents/tests/test_chunk_rerank_budget.py
          aquillm/apps/documents/tests/test_rerank_http_cache.py
          aquillm/apps/documents/tests/test_rerank_capability_cache.py
          aquillm/apps/documents/tests/test_rerank_request_routing.py
          aquillm/apps/documents/tests/test_rerank_score_validation.py
          aquillm/apps/documents/tests/test_rag_cache.py
          aquillm/apps/memory/tests/test_chat_memory_latency.py
          aquillm/apps/chat/tests/test_rag_config.py
          aquillm/apps/chat/tests/test_rag_evidence.py
          aquillm/apps/chat/tests/test_rag_retrieval.py
          aquillm/apps/chat/tests/test_rag_candidate_pool.py
          aquillm/apps/chat/tests/test_rag_evidence_handoff.py
          aquillm/apps/chat/tests/test_direct_rag_pipeline.py
          aquillm/apps/chat/tests/test_direct_rag_recovery.py
          aquillm/apps/chat/tests/test_direct_rag_websocket_smoke.py
          aquillm/apps/chat/tests/test_rag_synthesis.py
          aquillm/tests/integration/test_vllm_extra_args_parser.py
          aquillm/tests/integration/test_vllm_genesis_image.py
          aquillm/tests/integration/test_vllm_readiness.py
          aquillm/tests/integration/test_vllm_lmcache_plumbing.py
          aquillm/tests/integration/test_compose_multimodal_services.py
          -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm test -- src/features/chat/hooks/useChatWebSocket.test.tsx src/features/chat/components/Chat.test.tsx
      - run: npm run build
