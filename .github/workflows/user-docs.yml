name: Deploy User Docs via GitHub Pages

on:
  push:
    branches: [development]
    paths:
      - 'user-docs/**'
      - 'aquillm/lib/skills/**'
      - 'docs/skills/runtime/**'
      - '.github/workflows/user-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: user-docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: user-docs/docs/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r user-docs/docs/requirements.txt

      - name: Build Sphinx HTML
        env:
          SPHINX_HTML_BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/user-docs/
        run: python -m sphinx -b html user-docs/docs/source user-docs/docs/build/html/user-docs

      - name: Add root redirect to /user-docs/
        run: echo '<meta http-equiv="refresh" content="0; url=user-docs/">' > user-docs/docs/build/html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: user-docs/docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
